<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Quiet Outside</title>
<meta name="description" content="Something is listening. Scavenge, dig, save people, and survive 20 days.">
<style>
:root{--bg:#0b0c0f;--panel:#15171c;--panel2:#1b1e24;--line:#2a2e37;--txt:#dcd8cc;--dim:#8a8676;--red:#d24b43;--amber:#d9a441;--green:#6fae5a;--blue:#5b8fd1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#ui{position:fixed;inset:0;overflow:auto;padding:22px 18px 60px;display:flex;justify-content:center}
.wrap{width:100%;max-width:1020px}
h1{font-size:clamp(38px,8vw,86px);letter-spacing:.14em;margin:9vh 0 6px;font-weight:400;text-align:center;color:#eee;text-shadow:0 0 34px rgba(210,75,67,.4)}
h2{font-weight:400;margin:4px 0 10px;font-size:30px;letter-spacing:.04em}
h3{font-weight:400;color:var(--amber);letter-spacing:.12em;text-transform:uppercase;font-size:14px;margin:24px 0 10px}
.tag{text-align:center;color:var(--dim);font-style:italic;font-size:18px;margin-bottom:30px}
.center{text-align:center}
.dim{color:var(--dim)}.small{font-size:13px}.red{color:var(--red)}.green{color:var(--green)}.amber{color:var(--amber)}
.btn{font:16px Georgia,serif;background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:11px 18px;border-radius:5px;cursor:pointer;margin:4px 6px 4px 0;transition:.15s}
.btn:hover:not([disabled]){border-color:var(--amber);color:#fff}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.big{font-size:20px;padding:14px 40px;letter-spacing:.1em}
.btn.amber{border-color:#7a5c24;background:#2a2213}.btn.red{border-color:#7a2a25;background:#2a1513}
.mini{font:13px Georgia,serif;background:#232831;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:5px 9px;cursor:pointer;margin-top:8px}
.mini:hover{border-color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.card.click{cursor:pointer;transition:.15s}.card.click:hover{border-color:var(--amber);transform:translateY(-2px)}
.card .ic{font-size:30px;margin-right:10px}
.row{display:flex;align-items:center;margin-bottom:8px}
.bar{height:6px;background:#262a31;border-radius:3px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.inv{display:flex;gap:14px;flex-wrap:wrap;font-size:17px}
.inv span{background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:4px}
.log{background:#101216;border-left:3px solid #3a2f22;padding:10px 16px;margin-top:16px;font-size:15px;max-height:220px;overflow:auto}
.log p{margin:5px 0}.log p.day{color:var(--amber);font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin-top:10px}
.warn{background:#24160f;border:1px solid #5c3a1f;padding:10px 14px;border-radius:5px;margin-top:12px}
label{font-size:14px;margin-right:12px;cursor:pointer}
.need{margin-top:12px;font-size:15px}
.pro{color:var(--green);font-size:14px;margin:6px 0 2px}.con{color:var(--red);font-size:14px}
.tgrid{display:grid;gap:2px;margin-top:12px;user-select:none}
.tile{aspect-ratio:1;border-radius:2px;cursor:pointer;font-size:clamp(9px,1.6vw,18px);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.tile.can{outline:2px dashed rgba(217,164,65,.7);outline-offset:-3px}
.tile.can:hover{outline-color:#fff}
.tile .s{position:absolute;bottom:1px;right:2px;font-size:clamp(7px,.9vw,11px);opacity:.9}
.modes{margin-top:12px}
.mode{font:14px Georgia,serif;background:var(--panel);color:var(--txt);border:1px solid var(--line);padding:8px 12px;border-radius:4px;cursor:pointer;margin:3px 4px 3px 0}
.mode.on{border-color:var(--amber);background:#2a2213;color:#fff}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:16px;font-size:13px;color:var(--dim)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:middle}
#cv{position:fixed;inset:0;display:none}
#dlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:10;padding:16px}
.box{background:var(--panel);border:1px solid var(--line);padding:26px;max-width:540px;border-radius:6px;font-size:17px;line-height:1.55}
.box .ic{font-size:44px}
.ending{max-width:640px;margin:8vh auto 0;text-align:center;font-size:19px;line-height:1.7}
.ending .ic{font-size:70px}
.elist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.elist span{border:1px solid var(--line);padding:6px 10px;border-radius:4px;font-size:14px}
.elist span.got{border-color:var(--amber);color:var(--amber)}
.how{max-width:680px;margin:30px auto 0;font-size:15px;color:var(--dim);line-height:1.7}
.how b{color:var(--txt)}
kbd{background:#262a31;border:1px solid #3a3f49;border-radius:3px;padding:1px 6px;font-family:monospace;color:#fff}
</style>
</head>
<body>
<div id="ui"></div>
<canvas id="cv"></canvas>
<div id="dlg"><div class="box" id="dlgbox"></div></div>

<script>
/* =========================================================
   THE QUIET OUTSIDE  v1
   ========================================================= */
const $=s=>document.querySelector(s);
const ui=$('#ui'),cv=$('#cv'),cx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri2=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wpick(w){let s=0;for(const k in w)s+=w[k];let r=Math.random()*s;for(const k in w){if((r-=w[k])<0)return k}return Object.keys(w)[0]}

/* ---------- audio ---------- */
let AC=null,muted=false,drone=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,type='sine',v=.05,slide=0){if(muted||!ac())return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function hiss(d,v=.1,lp=3000){if(muted||!ac())return;try{const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
function startDrone(){if(muted||!ac()||drone)return;try{const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=48;o2.type='triangle';o2.frequency.value=48.6;g.gain.value=.025;o.connect(g);o2.connect(g);g.connect(AC.destination);o.start();o2.start();drone={o,o2,g}}catch(e){}}
function stopDrone(){if(drone){try{drone.o.stop();drone.o2.stop()}catch(e){}drone=null}}
const heartbeat=()=>{tone(60,.12,'sine',.18);setTimeout(()=>tone(52,.14,'sine',.14),140)};
const scream=()=>{tone(700,.9,'sawtooth',.06,.25);tone(1050,.7,'square',.025,.3);hiss(.5,.08,1500)};

/* ---------- data ---------- */
const ITEMS={food:'🥫',water:'💧',meds:'💊',planks:'🪵',metal:'🔩',poles:'🏗️',shovel:'🪏',pickaxe:'⛏️'};
const INAME={food:'food',water:'water',meds:'medicine',planks:'planks',metal:'metal sheets',poles:'scaffold poles',shovel:'a SHOVEL',pickaxe:'a PICKAXE'};
const LOCS={
  supermarket:{name:'Supermarket',ic:'🏪',loot:{food:6,water:5,planks:1}},
  pharmacy:{name:'Pharmacy',ic:'💊',loot:{meds:6,water:2,food:1},surv:'maya'},
  hardware:{name:'Hardware Store',ic:'🔧',loot:{planks:4,metal:4,poles:2,shovel:1,pickaxe:1}},
  school:{name:'School',ic:'🏫',loot:{food:3,water:3,meds:1,planks:2},surv:'leo',file:true},
  office:{name:'Office Block',ic:'🏢',loot:{water:3,food:2,metal:3,poles:1,pickaxe:.5},surv:'dex',file:true},
  house:{name:'Suburban House',ic:'🏠',loot:{food:3,water:2,planks:3,meds:1,shovel:.6},surv:'tom'},
  church:{name:'Old Church',ic:'⛪',loot:{food:2,water:2,meds:2,planks:2},surv:'dog',file:true},
};
const STARTS={
  supermarket:{pro:'Loads of food and water to start',con:'Huge glass windows. It finds you more often.',inv:{food:14,water:10,meds:0,planks:1,metal:0,poles:0},exposure:.15,cap:6,dirtMax:10},
  office:{pro:'Room for 6 · building materials in storage',con:'Hardly any food',inv:{food:3,water:6,meds:1,planks:3,metal:3,poles:1},exposure:.08,cap:6,dirtMax:16},
  pharmacy:{pro:'Stacked with medicine',con:'Tiny. Room for only 3 people.',inv:{food:4,water:5,meds:8,planks:0,metal:0,poles:0},exposure:.06,cap:3,dirtMax:8},
  house:{pro:'Garden grows 1 food a day · soft basement (+2 dig energy)',con:'Few supplies',inv:{food:5,water:3,meds:1,planks:2,metal:0,poles:0},exposure:.08,cap:5,dirtMax:14},
  hardware:{pro:'Shovel, pickaxe and loads of tunnel supports',con:'No food or water at all',inv:{food:1,water:1,meds:0,planks:6,metal:5,poles:3},tools:true,exposure:.09,cap:5,dirtMax:14},
  church:{pro:'Thick stone walls. The safest place.',con:'Freezing: burns 1 plank a night or everyone gets cold',inv:{food:4,water:4,meds:2,planks:3,metal:0,poles:0},exposure:.03,cap:6,dirtMax:12},
};
const SURV={
  maya:{name:'Maya',role:'Nurse',ic:'🩺',desc:'Heals everyone +10 HP a night (once her wound is treated).',injured:true,
    meet:"A woman is slumped behind the counter, gripping her leg. \"Please... I'm a nurse. I can keep all of you alive. But this wound needs medicine, soon.\""},
  tom:{name:'Old Tom',role:'Builder',ic:'🔨',desc:'Reinforces your tunnels every night and barricades the shelter. Eats 2 food.',
    meet:"An old man sits on the stairs with a toolbox on his knees. \"Built half the houses on this street. Bad knees, big appetite. But I can make any place solid.\""},
  leo:{name:'Leo',role:'Kid',ic:'🧒',desc:'Squeezes through vents to find extra supplies. Sometimes cries at night.',
    meet:"A small boy is hiding under a desk, shaking. He doesn't say a word. He just looks at you and holds out his hand."},
  dex:{name:'Dex',role:'Soldier',ic:'🪖',desc:'You carry +4 items while he\'s with you, and he digs (+2 energy). Can he be trusted?',
    meet:"A man in torn army gear steps out of the shadows. \"Take me with you. I'll carry double and dig for you. Just make sure there's food.\""},
  dog:{name:'Biscuit',role:'Dog',ic:'🐕',desc:'Senses the creature. An arrow shows where it is when you scavenge.',
    meet:"A scruffy dog pads out of the dark, tail low. It whimpers and presses against your leg."},
};
const FILES=[
  "PROJECT LISTENER: Day 41. The subject responds to any sound above 40 decibels. It does not see well. It does not need to.",
  "PROJECT LISTENER: Containment failure. It has learned to copy voices. If someone knocks and asks to be let in, DO NOT assume it is a person.",
  "PROJECT LISTENER: Subject L (child, 9) was the only one it never harmed. It goes calm around him. Keep L away from the facility. Keep L safe."
];
const RADIO=["📻 Static... \"...anyone hearing this, stay inside. Stay quiet...\"","📻 \"...rescue helicopters are being prepared. Hold on until day 20...\"","📻 \"...do not open your door at night. Whatever you hear...\"","📻 \"...it hunts by sound. Silence is your only weapon...\"","📻 \"...evacuation from the old church car park, day 20...\""];
const ENDINGS={
  everyone:{t:'Everyone Made It',ic:'🚁'},rescued:{t:'Rescue',ic:'🚁'},hard:{t:'The Hard Choice',ic:'💔'},alone:{t:'Alone',ic:'🥀'},
  underground:{t:'The Underground',ic:'🚇'},sewers:{t:'The Sewers',ic:'🌊'},truth:{t:'The Truth',ic:'🌫️'},betrayed:{t:'Betrayed',ic:'🚪'},
  taken:{t:'Taken',ic:'🌑'},starved:{t:'The Long Hunger',ic:'🍂'},buried:{t:'Buried',ic:'🪦'}
};
function gotEndings(){try{return JSON.parse(localStorage.getItem('quietoutside_endings')||'[]')}catch(e){return[]}}
function saveEnding(e){const g=gotEndings();if(!g.includes(e)){g.push(e);try{localStorage.setItem('quietoutside_endings',JSON.stringify(g))}catch(x){}}}

/* ---------- game state ---------- */
let G=null,S=null,tMode='dig';
const has=id=>G.people.some(p=>p.id===id);
const you=()=>G.people.find(p=>p.id==='you');
function mkPerson(id){
  if(id==='you')return{id,name:'You',role:'Survivor',ic:'🧍',hp:100,hunger:0,thirst:0,eat:true,drink:true};
  if(id.startsWith('stranger')){const n=pick(['Sam','Priya','Jordan','Alex','Rosa','Kai','Nina','Omar']);return{id,name:n,role:'Stranger',ic:'🧑',hp:70,hunger:1,thirst:1,eat:true,drink:true}}
  const s=SURV[id];return{id,name:s.name,role:s.role,ic:s.ic,hp:s.injured?40:80,hunger:1,thirst:1,eat:true,drink:true,injured:!!s.injured};
}
function addLog(t,cls){G.log.push({t,cls})}
const ST=()=>STARTS[G.start];

function newGame(startId){
  if(startId==='random')startId=pick(Object.keys(STARTS));
  const S0=STARTS[startId];
  G={day:1,max:20,start:startId,inv:{...S0.inv},tools:{shovel:!!S0.tools,pickaxe:!!S0.tools},people:[mkPerson('you')],
     energy:0,dirt:0,acted:false,log:[],files:0,locs:{},rescued:0,deaths:[],lost:0,left:0,dexBetrayed:false,strangerN:0,
     storm:false,sewer:false,radio:0,tmsg:''};
  for(const id in LOCS){if(id===startId)continue;G.locs[id]={visits:0,surv:LOCS[id].surv||null,file:!!LOCS[id].file,tunnel:false,bonus:false}}
  const sv=LOCS[startId].surv;
  if(sv){const free=Object.keys(G.locs).filter(k=>!G.locs[k].surv);G.locs[pick(free)].surv=sv}
  if(LOCS[startId].file){const free=Object.keys(G.locs).filter(k=>!G.locs[k].file);G.locs[pick(free)].file=true}
  if(startId==='hardware'){G.tools.shovel=true;G.tools.pickaxe=true}
  G.tunnel=genTunnel();
  resetEnergy();
  addLog('— Day 1 —','day');
  addLog(`You barricade yourself inside the ${LOCS[startId].name.toLowerCase()}. Outside, something is listening. Rescue is coming on day 20, so survive until then.`);
  addLog('Tip: go scavenging for supplies, or dig tunnels from your basement to reach other buildings without going outside.');
  dayScreen();
}
function resetEnergy(){G.energy=3+(G.tools.shovel?3:0)+(G.tools.pickaxe?1:0)+(G.start==='house'?2:0)+(has('dex')?2:0)}
const foodNeed=()=>G.people.reduce((s,p)=>s+(p.eat?(p.id==='tom'?2:1):0),0);
const waterNeed=()=>G.people.reduce((s,p)=>s+(p.drink?1:0),0);
function invHTML(){return['food','water','meds','planks','metal','poles'].map(k=>`<span title="${INAME[k]}">${ITEMS[k]} ${G.inv[k]}</span>`).join('')+(G.tools.shovel?'<span title="shovel">🪏</span>':'')+(G.tools.pickaxe?'<span title="pickaxe">⛏️</span>':'')}

/* ---------- screens ---------- */
function show(h){stopScav();ui.innerHTML=h;ui.style.display='flex';cv.style.display='none';ui.scrollTop=0}
function dlg(h){$('#dlgbox').innerHTML=h;$('#dlg').style.display='flex'}
function closeDlg(){$('#dlg').style.display='none'}

function titleScreen(){
  const got=gotEndings();
  show(`<div class="wrap"><h1>THE QUIET OUTSIDE</h1><div class="tag">Something is out there. It hunts by sound.<br>Survive 20 days.</div>
  <div class="center"><button class="btn big" onclick="startPick()">BEGIN</button></div>
  <div class="center dim small" style="margin-top:14px">Endings found: ${got.length} / ${Object.keys(ENDINGS).length}</div>
  <div class="how">
  <p><b>Each day</b> you choose: go out scavenging, dig tunnels, or rest. At night everyone needs food and water.</p>
  <p><b>Scavenging:</b> <kbd>WASD</kbd> move · hold <kbd>Shift</kbd> to sneak (quiet) · hold <kbd>Space</kbd> to sprint (LOUD) · <kbd>E</kbd> search / hide / talk / leave · <kbd>M</kbd> mute. Every sound you make spreads out as a ring. If it reaches the creature, it comes. Hide in wardrobes and cars.</p>
  <p><b>Tunnels:</b> dig from your basement to other buildings so you can enter them from below, where it's much safer. Weak soil collapses unless you brace it with planks, metal or scaffold poles.</p>
  <p><b>People:</b> you'll find survivors who can help you, but every one is another mouth to feed. Your choices decide which of the 11 endings you get.</p>
  <p class="small">Best played on a computer with headphones.</p></div></div>`);
}
function startPick(){
  ac();
  let h=`<div class="wrap"><h2 style="margin-top:4vh">Where do you hide?</h2><p class="dim">Your starting shelter changes everything.</p><div class="grid">`;
  for(const id in STARTS){const s=STARTS[id],L=LOCS[id];
    h+=`<div class="card click" onclick="newGame('${id}')"><div class="row"><span class="ic">${L.ic}</span><b style="font-size:19px">${L.name}</b></div><div class="pro">＋ ${s.pro}</div><div class="con">－ ${s.con}</div><div class="dim small" style="margin-top:6px">Room for ${s.cap} people</div></div>`}
  h+=`<div class="card click" onclick="newGame('random')"><div class="row"><span class="ic">🎲</span><b style="font-size:19px">Random</b></div><div class="dim">Wake up somewhere. Anywhere.</div></div></div>
  <p><button class="btn" onclick="titleScreen()">← Back</button></p></div>`;
  show(h);
}
function hungerTxt(p){return p.hunger>=2?'<span class="red">starving</span>':p.hunger===1?'<span class="amber">hungry</span>':'fed'}
function thirstTxt(p){return p.thirst>=2?'<span class="red">dehydrated</span>':p.thirst===1?'<span class="amber">thirsty</span>':'hydrated'}
function personCard(p,i){
  const c=p.hp>60?'var(--green)':p.hp>30?'var(--amber)':'var(--red)';
  return `<div class="card"><div class="row"><span class="ic">${p.ic}</span><div><b>${p.name}</b><div class="dim small">${p.role}${p.injured?' · <span class="red">wounded, needs medicine</span>':''}</div></div></div>
  <div class="bar"><i style="width:${clamp(p.hp,0,100)}%;background:${c}"></i></div>
  <div class="small">${Math.ceil(p.hp)} HP · ${hungerTxt(p)} · ${thirstTxt(p)}</div>
  <div style="margin-top:6px"><label><input type="checkbox" ${p.eat?'checked':''} onchange="G.people[${i}].eat=this.checked;dayScreen()"> Eat${p.id==='tom'?' (2)':''}</label>
  <label><input type="checkbox" ${p.drink?'checked':''} onchange="G.people[${i}].drink=this.checked;dayScreen()"> Drink</label></div>
  ${G.inv.meds>0&&(p.hp<100||p.injured)?`<button class="mini" onclick="useMed(${i})">💊 Give medicine</button>`:''}
  ${SURV[p.id]?`<div class="dim small" style="margin-top:6px">${SURV[p.id].desc}</div>`:''}</div>`;
}
function dayScreen(){
  updateTunnelLinks();
  const L=LOCS[G.start],s=ST();
  const fn=foodNeed(),wn=waterNeed();
  let h=`<div class="wrap"><div class="top"><div><div class="dim">${L.ic} ${L.name}, your shelter</div><h2>Day ${G.day} <span class="dim">/ ${G.max}</span></h2></div><div class="inv">${invHTML()}</div></div>`;
  if(G.storm)h+=`<div class="warn">⛈️ A storm is raging. It's too dangerous to go outside today, but you can still dig.</div>`;
  h+=`<div class="log" id="log">${G.log.slice(-14).map(l=>`<p class="${l.cls||''}">${l.t}</p>`).join('')}</div>`;
  h+=`<h3>Your group (${G.people.length}/${s.cap})</h3><div class="grid">${G.people.map(personCard).join('')}</div>`;
  h+=`<div class="need">Tonight: <b>${fn}</b> food and <b>${wn}</b> water for everyone ticked. You have <b class="${G.inv.food<fn?'red':''}">${G.inv.food}</b> food and <b class="${G.inv.water<wn?'red':''}">${G.inv.water}</b> water.</div>`;
  h+=`<h3>What now?</h3><div>
    <button class="btn" ${G.acted||G.storm?'disabled':''} onclick="pickLoc()">🔦 Go scavenging</button>
    <button class="btn" onclick="tunnelScreen()">🕳️ Tunnels (${G.energy} energy)</button>
    <button class="btn" ${G.acted?'disabled':''} onclick="rest()">💤 Rest (+25 HP for you)</button>
    ${G.sewer?`<button class="btn red" onclick="sewerAsk()">🌊 Escape through the sewers</button>`:''}
    <button class="btn amber" onclick="endDay()">🌙 End the day</button></div>
    ${G.acted?'<p class="dim small">You\'ve used your main action today. You can still dig if you have energy, or end the day.</p>':''}
    <p class="dim small" style="margin-top:20px">Strange files found: ${G.files}/3 · Buildings linked by tunnel: ${Object.values(G.locs).filter(l=>l.tunnel).length}/6</p></div>`;
  show(h);
  const lg=$('#log');if(lg)lg.scrollTop=lg.scrollHeight;
}

function rest(){G.acted=true;const y=you();y.hp=Math.min(100,y.hp+25);addLog('💤 You rested and got some strength back (+25 HP).');dayScreen()}
function sewerAsk(){dlg(`<div class="ic">🌊</div><p>The tunnel has broken into the old storm sewers. They run under the whole city and out past the edge of town.</p><p>Leave now with everyone in your group?</p><button class="btn red" onclick="closeDlg();finish('sewers')">Go into the dark</button><button class="btn" onclick="closeDlg()">Not yet</button>`)}

/* ---------- night ---------- */
function endDay(){
  const S0=ST(),lines=[];let youCause=null;
  for(const p of G.people){
    const fn=p.id==='tom'?2:1;
    if(p.eat&&G.inv.food>=fn){G.inv.food-=fn;p.hunger=0}else p.hunger++;
    if(p.drink&&G.inv.water>=1){G.inv.water--;p.thirst=0}else p.thirst++;
    if(p.hunger>=2)p.hp-=8*(p.hunger-1);
    if(p.thirst>=1)p.hp-=12*p.thirst;
    if(p.injured){p.hp-=12;lines.push(`🩸 ${p.name}'s wound is getting worse.`)}
  }
  const maya=G.people.find(p=>p.id==='maya');
  if(maya&&!maya.injured){G.people.forEach(p=>p.hp=Math.min(100,p.hp+10));lines.push('🩺 Maya checked on everyone (+10 HP).')}
  if(G.start==='house'){G.inv.food++;lines.push('🥕 The garden gave you 1 food.')}
  if(G.start==='church'){if(G.inv.planks>0){G.inv.planks--;lines.push('🔥 You burned a plank to keep warm.')}else{G.people.forEach(p=>p.hp-=6);lines.push('🥶 No wood to burn. Everyone froze (-6 HP).')}}
  if(has('leo')&&Math.random()<.5){const it=pick(['food','water','meds','planks','food','water']);G.inv[it]++;lines.push(`🧒 Leo crawled through the vents and came back with ${ITEMS[it]} 1 ${INAME[it]}.`)}
  if(has('dex')&&G.day>=4&&G.inv.food<G.people.length*2&&Math.random()<.35){
    const st=Math.ceil(G.inv.food/2),sw=Math.ceil(G.inv.water/3);G.inv.food-=st;G.inv.water-=sw;
    G.people=G.people.filter(p=>p.id!=='dex');G.dexBetrayed=true;lines.push(`🚪 In the night, Dex vanished... and took ${st} food and ${sw} water with him.`)}
  for(const p of [...G.people])if(p.thief&&p.joined<G.day&&Math.random()<.6){
    const st=Math.min(G.inv.food,3);G.inv.food-=st;G.inv.meds=Math.max(0,G.inv.meds-1);G.people=G.people.filter(q=>q!==p);
    lines.push(`🚪 ${p.name} slipped out before dawn with ${st} food. You never should have trusted them.`)}
  // tunnel decay
  let col=0;
  for(const c of G.tunnel){if(!c.dug||c.soil==='building')continue;
    let d=SOIL[c.soil].decay*(c.sup?SUPS[c.sup].mult:1);if(has('tom'))d=Math.max(0,d-5);
    c.stab-=d;if(c.stab<=0){c.dug=false;c.sup=null;c.stab=0;col++}}
  if(col)lines.push(`💥 You heard a deep rumble. ${col} section${col>1?'s':''} of tunnel collapsed.`);
  else if(has('tom')&&G.tunnel.some(c=>c.dug&&c.soil!=='building'))lines.push('🔨 Tom shored up the tunnels.');
  // night attack
  let risk=S0.exposure+G.people.length*.015+(has('leo')?.04:0);if(has('tom'))risk*=.5;
  if(G.day>1&&Math.random()<risk){
    const others=G.people.filter(p=>p.id!=='you');const v=others.length?pick(others):you();
    const dmg=has('dog')?20:35;v.hp-=dmg;const lostF=Math.min(G.inv.food,2);G.inv.food-=lostF;
    if(v.id==='you')youCause='taken';
    lines.push(`🌑 Something got in during the night. ${v.name==='You'?'You were':v.name+' was'} hurt (-${dmg} HP)${lostF?` and ${lostF} food was ruined`:''}.${has('dog')?' Biscuit\'s barking woke everyone just in time.':''}`)}
  // deaths
  for(const p of [...G.people]){
    if(p.hp>0){p.hp=Math.min(100,p.hp);continue}
    if(p.id==='you'){G.log.push(...lines.map(t=>({t})));return finish(youCause||'starved')}
    G.people=G.people.filter(q=>q!==p);G.deaths.push(p.name);lines.push(`🕯️ ${p.name} didn't make it through the night.`)}
  G.day++;G.acted=false;G.storm=false;G.tmsg='';
  updateTunnelLinks();resetEnergy();
  if(G.day>G.max){G.log.push(...lines.map(t=>({t})));return finish()}
  addLog(`— Day ${G.day} —`,'day');lines.forEach(t=>addLog(t));
  tone(220,1.2,'sine',.04,.5);
  // morning event
  if(G.day>=2&&Math.random()<.4)return morningEvent();
  dayScreen();
}
function morningEvent(){
  const r=Math.random();
  if(r<.3&&G.people.length<ST().cap){
    hiss(.15,.2,800);setTimeout(()=>hiss(.15,.2,800),300);
    return dlg(`<div class="ic">🚪</div><p>Before dawn there's a soft knock at the door. Three taps.</p><p>A voice whispers: <i>"Please... I've been out here for days. Please let me in."</i></p>
      <button class="btn amber" onclick="knock(true)">Open the door</button><button class="btn" onclick="knock(false)">Stay silent</button>`);
  }
  if(r<.5){G.storm=true;addLog('⛈️ A storm rolled in. Going outside today would be suicide.')}
  else if(r<.75){addLog(RADIO[G.radio%RADIO.length]);G.radio++}
  else{const ids=Object.keys(G.locs),id=pick(ids);G.locs[id].bonus=true;addLog(`📦 A helicopter flew over and dropped a supply crate near the ${LOCS[id].name.toLowerCase()}.`)}

function knock(open){
  closeDlg();
  if(!open){addLog('You held your breath until the knocking stopped. The footsteps that left didn\'t sound human... or did they?');return dayScreen()}
  const r=Math.random();
  if(r<.18){const v=pick(G.people);v.hp-=30;scream();addLog(`🌑 It wasn't a person. The thing copied a voice. ${v.name==='You'?'You were':v.name+' was'} slashed (-30 HP) before you slammed the door.`,'red');
    if(you().hp<=0)return finish('taken');if(v.hp<=0&&v.id!=='you'){G.people=G.people.filter(q=>q!==v);G.deaths.push(v.name);addLog(`🕯️ ${v.name} didn't survive.`)}}
  else{G.strangerN++;const p=mkPerson('stranger'+G.strangerN);p.joined=G.day;if(r>.78)p.thief=true;G.people.push(p);G.rescued++;addLog(`🧑 A frightened survivor called ${p.name} stumbled inside. They don't have much to offer, but they're grateful.`)}

/* ---------- tunnels ---------- */
const TW=20,TH=12;
const SOIL={soft:{n:'Soft soil',cost:1,stab:55,decay:10,col:'#4f3d2b'},clay:{n:'Clay',cost:2,stab:75,decay:6,col:'#6a4630'},
  wet:{n:'Wet soil (river)',cost:1,stab:38,decay:18,col:'#2f4558'},rock:{n:'Rock',cost:3,stab:100,decay:0,col:'#55575c'},building:{n:'Basement',cost:1,stab:100,decay:0,col:'#2a2a2a'}};
const SUPS={planks:{n:'Wooden planks',ic:'🪵',add:35,mult:.5},metal:{n:'Metal sheets',ic:'🔩',add:50,mult:.25},poles:{n:'Scaffold poles',ic:'🏗️',add:100,mult:0}};
function genTunnel(){
  const t=[];
  for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){const r=Math.random();let soil=r<.5?'soft':r<.8?'clay':'rock';if(x===11||x===12)soil=Math.random()<.85?'wet':'soft';t.push({x,y,soil,dug:false,stab:0,sup:null,b:null})}
  // clump rocks a bit
  for(let k=0;k<6;k++){const cx0=ri2(4,18),cy0=ri2(0,11);for(let i=0;i<5;i++){const x=clamp(cx0+ri2(-1,1),0,TW-1),y=clamp(cy0+ri2(-1,1),0,TH-1);if(x!==11&&x!==12)t[y*TW+x].soil='rock'}}
  const T=(x,y)=>t[y*TW+x];
  const home=T(2,6);home.b='home';home.dug=true;home.stab=100;home.soil='building';
  [[1,6],[3,6],[2,5],[2,7]].forEach(([x,y])=>{if(T(x,y).soil==='rock')T(x,y).soil='soft'});
  const spots=[[6,2],[7,10],[9,5],[15,1],[15,9],[17,5]];
  shuffle(Object.keys(G.locs)).forEach((id,i)=>{const [x,y]=spots[i];const c=T(x,y);c.b=id;c.soil='building'});
  const sw=T(19,11);sw.b='sewer';sw.soil='building';
  return t;
}
function nbrs(c){const r=[];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=c.x+dx,y=c.y+dy;if(x>=0&&y>=0&&x<TW&&y<TH)r.push(G.tunnel[y*TW+x])}return r}
function conn(){const s=new Set(),st=G.tunnel[6*TW+2],q=[st];s.add(st);while(q.length){const c=q.pop();for(const n of nbrs(c))if(n.dug&&!s.has(n)){s.add(n);q.push(n)}}return s}
function updateTunnelLinks(){const s=conn();for(const id in G.locs)G.locs[id].tunnel=false;G.sewer=false;for(const c of s){if(c.b&&G.locs[c.b])G.locs[c.b].tunnel=true;if(c.b==='sewer')G.sewer=true}}
const dirtMax=()=>ST().dirtMax+6*Object.values(G.locs).filter(l=>l.tunnel).length;
function tileColor(c){
  if(c.b){return c.dug?'#3b3426':'#1d1d1f'}
  if(c.dug){const h=clamp(c.stab,0,100)*1.2;return `hsl(${h},42%,${c.stab<25?30:24}%)`}
  return SOIL[c.soil].col;
}

  <div class="modes">${[['dig','⛏ Dig'],['planks',`🪵 Brace: planks (${G.inv.planks})`],['metal',`🔩 Brace: metal (${G.inv.metal})`],['poles',`🏗️ Brace: poles (${G.inv.poles})`]].map(([m,l])=>`<button class="mode ${tMode===m?'on':''}" onclick="tMode='${m}';tunnelScreen()">${l}</button>`).join('')}</div>

    h+=`<div class="tile ${can||canSup?'can':''}" title="${tip}" style="background:${tileColor(c)};${c.dug&&!cs.has(c)?'opacity:.5':''}" onclick="tclick(${i})">${ic}${c.dug&&!c.b?`<span class="s">${Math.round(c.stab)}</span>`:''}</div>`;
  });
  h+=`</div><p id="tinfo" class="${G.tmsgc||''}" style="min-height:24px;margin-top:12px">${G.tmsg||'Click a highlighted tile next to your tunnel to dig. Choose a brace material, then click a dug tile to stop it collapsing.'}</p>

function tmsg(t,c){G.tmsg=t;G.tmsgc=c||''}
function tclick(i){

      let cls=c.b?'green':'';
      for(const n of nbrs(c)){if(n.dug&&!n.b&&n.stab<25&&Math.random()<.4){
        n.dug=false;n.sup=null;n.stab=0;const y=you();y.hp-=25;hiss(.8,.3,300);tone(50,.8,'sawtooth',.1,.5);
        msg='💥 CAVE-IN! A weak section collapsed on top of you (-25 HP).';cls='red';
        if(y.hp<=0){addLog('💥 The tunnel caved in.');return finish('buried')}break}}

    }

  }
  tunnelScreen();

/* ---------- scavenging ---------- */
const T=32,MW=44,MH=30;
const solid=c=>c===2||c===3||c===4||c===5;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function genMap(id,tun){
  const m=new Uint8Array(MW*MH),I=(x,y)=>y*MW+x;
  const bx0=3,by0=2,bx1=40,by1=21,hy=11,vx=[15,28];
  for(let y=by0;y<=by1;y++)for(let x=bx0;x<=bx1;x++)m[I(x,y)]=(x===bx0||x===bx1||y===by0||y===by1)?2:1;
  for(let y=by0;y<=by1;y++)for(const v of vx)m[I(v,y)]=2;
  for(let x=bx0;x<=bx1;x++)m[I(x,hy)]=2;
  const doors=[];const door=(x,y)=>{m[I(x,y)]=1;doors.push([x,y])};
  const secs=[[bx0+1,vx[0]-1],[vx[0]+1,vx[1]-1],[vx[1]+1,bx1-1]];
  for(const [a,b] of secs){const x=ri2(a+1,b-2);door(x,hy);door(x+1,hy)}
  for(const v of vx){let y=ri2(by0+2,hy-3);door(v,y);door(v,y+1);y=ri2(hy+2,by1-3);door(v,y);door(v,y+1)}
  door(21,by1);door(22,by1);
  const sd=ri2(hy+2,by1-3);door(bx0,sd);door(bx0,sd+1);
  const sd2=ri2(by0+2,hy-3);door(bx1,sd2);door(bx1,sd2+1);
  const rooms=[];for(const [a,b] of secs){rooms.push([a,by0+1,b,hy-1]);rooms.push([a,hy+1,b,by1-1])}
  const nearDoor=(x,y)=>doors.some(([dx,dy])=>Math.abs(dx-x)<=1&&Math.abs(dy-y)<=1);
  const wallAdj=(x,y)=>DIRS.some(([a,b])=>m[I(x+a,y+b)]===2);
  const conts=new Map();
  const kinds=['shelf','cupboard','fridge','desk','box'];
  rooms.forEach((r,ri)=>{
    let n=3+ri2(0,1),tries=0;
    while(n>0&&tries++<300){const x=ri2(r[0],r[2]),y=ri2(r[1],r[3]);
      if(m[I(x,y)]===1&&!nearDoor(x,y)&&wallAdj(x,y)){m[I(x,y)]=3;conts.set(I(x,y),{x,y,kind:Math.random()<.2?'glass':pick(kinds),done:false});n--}}
    if(Math.random()<.7){tries=0;while(tries++<300){const x=ri2(r[0],r[2]),y=ri2(r[1],r[3]);if(m[I(x,y)]===1&&!nearDoor(x,y)&&wallAdj(x,y)){m[I(x,y)]=4;break}}}
  });
  // cars on street
  let cars=0,tries=0;
  while(cars<5&&tries++<200){const x=ri2(1,40),y=ri2(24,26);if(x>=18&&x<=25)continue;
    if(m[I(x,y)]===0&&m[I(x+1,y)]===0&&m[I(x-1,y)]===0&&m[I(x+2,y)]===0){m[I(x,y)]=5;m[I(x+1,y)]=5;cars++}}
  // some cars at top/sides
  if(m[I(8,0)]===0){m[I(8,0)]=5;m[I(9,0)]=5}
  m[I(21,27)]=6;
  const free=()=>{for(let k=0;k<500;k++){const r=pick(rooms),x=ri2(r[0],r[2]),y=ri2(r[1],r[3]);if(m[I(x,y)]===1&&!nearDoor(x,y))return[x,y]}return[10,6]};
  let hatch=null;if(tun){hatch=free();m[I(hatch[0],hatch[1])]=7}
  const spawn=hatch||[21,27];
  const L=G.locs[id];
  let surv=null,file=null;
  if(L.surv){let p;do{p=free()}while(Math.hypot(p[0]-spawn[0],p[1]-spawn[1])<8);surv={x:(p[0]+.5)*T,y:(p[1]+.5)*T,id:L.surv}}
  if(L.file){const p=free();file={x:(p[0]+.5)*T,y:(p[1]+.5)*T}}
  return{m,conts,spawn,surv,file,rooms};
}
const keys={};

function resizeCv(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';cx.setTransform(d,0,0,d,0,0)}

function startScav(id){
  G.acted=true;const L=G.locs[id],tun=L.tunnel;
  const mp=genMap(id,tun);

function stopScav(){if(S&&S.running){S.running=false;stopDrone()}}

const tileIdx=(x,y)=>clamp(Math.floor(y/T),0,MH-1)*MW+clamp(Math.floor(x/T),0,MW-1);

  if(ct!==tt){let best=-1,bv=c.field[ct]>=0?c.field[ct]:32000;const x=ct%MW,y=(ct/MW)|0;
    for(const [a,b] of DIRS){const nx=x+a,ny=y+b;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const n=ny*MW+nx,v=c.field[n];if(v>=0&&v<bv){bv=v;best=n}}
    if(best<0)return true;gx=(best%MW+.5)*T;gy=(((best/MW)|0)+.5)*T}

function interact(){

    const c=S.m[y*MW+x];if(![3,4,5,6,7].includes(c))continue;if(c===3&&S.conts.get(y*MW+x).done)continue;

  if(S.surv&&Math.hypot(S.surv.x-S.px,S.surv.y-S.py)<46)best={type:'surv'};

function updScav(dt){

  if(has('dog')){const a=Math.atan2(c.y-pyv,c.x-pxv),R=Math.min(W,H)/2-40;const ax=W/2+Math.cos(a)*R,ay=H/2+Math.sin(a)*R;
    cx.save();cx.translate(ax,ay);cx.rotate(a);cx.fillStyle=pd<300?'#d24b43':pd<600?'#d9a441':'#6fae5a';cx.beginPath();cx.moveTo(14,0);cx.lineTo(-8,9);cx.lineTo(-8,-9);cx.fill();cx.restore();
    cx.font='14px serif';cx.textAlign='center';cx.fillText('🐕',ax,ay-18)}
  hudScav(W,H);
}
function drawCreature(c){
  const t=c.anim;cx.save();cx.translate(c.x,c.y);
  cx.fillStyle='#050505';cx.strokeStyle='#1a1414';cx.lineWidth=3;
  for(let i=0;i<6;i++){const a=i/6*6.283+Math.sin(t*3+i)*.3;cx.beginPath();cx.moveTo(0,0);cx.quadraticCurveTo(Math.cos(a)*18,Math.sin(a)*18-6,Math.cos(a)*28,Math.sin(a)*24);cx.stroke()}
  cx.beginPath();cx.ellipse(0,-6,13,20,Math.sin(t*2)*.1,0,7);cx.fill();
  cx.fillStyle='#ff3020';const a=Math.sin(t*.7)*2;cx.beginPath();cx.arc(-5,-14+a,2.4,0,7);cx.arc(5,-14+a,2.4,0,7);cx.fill();
  cx.restore();
}
function hudScav(W,H){
  cx.textAlign='left';cx.textBaseline='top';
  cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(10,10,280,78);
  cx.fillStyle='#dcd8cc';cx.font='16px Georgia';cx.fillText(LOCS[S.id].ic+' '+LOCS[S.id].name,20,18);
  const tm=Math.max(0,S.time),mm=Math.floor(tm/60),ss=String(Math.floor(tm%60)).padStart(2,'0');
  cx.fillStyle=S.hunt?'#d24b43':tm<30?'#d9a441':'#8a8676';cx.font='14px Georgia';cx.fillText(S.hunt?'⚠ IT IS HUNTING YOU':`Safe for ${mm}:${ss}`,20,40);
  cx.fillStyle=S.hidden?'#a088c0':S.mode==='run'?'#d24b43':S.mode==='sneak'?'#6fae5a':'#dcd8cc';
  cx.fillText(S.hidden?'Hidden':S.mode==='run'?'Sprinting (LOUD)':S.mode==='sneak'?'Sneaking (quiet)':'Walking',20,60);
  // bag
  const cnt={};S.bag.forEach(k=>cnt[k]=(cnt[k]||0)+1);
  const bt=`Bag ${S.bag.length}/${S.cap}  `+Object.keys(cnt).map(k=>ITEMS[k]+cnt[k]).join(' ');
  cx.font='15px Georgia';const bw=cx.measureText(bt).width+24;
  cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(W-bw-10,10,bw,34);cx.fillStyle='#dcd8cc';cx.textAlign='right';cx.fillText(bt,W-22,19);
  // prompt
  const pr=promptText();
  if(pr){cx.textAlign='center';cx.font='16px Georgia';const w=cx.measureText(pr).width+30;cx.fillStyle='rgba(0,0,0,.65)';cx.fillRect(W/2-w/2,H-70,w,34);cx.fillStyle='#d9a441';cx.fillText(pr,W/2,H-61)}
  if(S.msgT>0){cx.textAlign='center';cx.font='18px Georgia';cx.fillStyle=`rgba(230,225,210,${Math.min(1,S.msgT)})`;cx.fillText(S.msg,W/2,H*.18)}
  cx.textAlign='left';cx.fillStyle='rgba(140,135,120,.7)';cx.font='12px Georgia';cx.fillText('WASD move · Shift sneak · Space sprint · E interact · P pause · M mute',12,H-22);
  if(S.paused){cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(0,0,W,H);cx.fillStyle='#fff';cx.textAlign='center';cx.font='40px Georgia';cx.fillText('PAUSED',W/2,H/2-20);cx.font='16px Georgia';cx.fillStyle='#8a8676';cx.fillText('press P to continue',W/2,H/2+30)}
}
function promptText(){
  if(S.hidden)return'[E] Leave hiding spot';
  if(S.search)return'Searching... (moving cancels)';
  if(S.surv&&Math.hypot(S.surv.x-S.px,S.surv.y-S.py)<46)return'[E] Talk';
  if(S.file&&Math.hypot(S.file.x-S.px,S.file.y-S.py)<40)return'[E] Pick up the file';
  const tx=Math.floor(S.px/T),ty=Math.floor(S.py/T);let best=null,bd=50;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=tx+dx,y=ty+dy;if(x<0||y<0||x>=MW||y>=MH)continue;const c=S.m[y*MW+x];
    if(![3,4,5,6,7].includes(c))continue;if(c===3&&S.conts.get(y*MW+x).done)continue;const d=Math.hypot((x+.5)*T-S.px,(y+.5)*T-S.py);if(d<bd){bd=d;best=c}}
  if(best===3)return'[E] Search';if(best===4)return'[E] Hide in wardrobe';if(best===5)return'[E] Hide in car';
  if(best===6||best===7)return`[E] Go home${S.follower?' with '+S.follower.name:''}`;
  return'';
}

/* ---------- endings ---------- */
function finish(forced){
  stopScav();closeDlg();
  let e=forced;
  const others=G.people.filter(p=>p.id!=='you');
  if(!e){
    const linked=Object.values(G.locs).filter(l=>l.tunnel).length;
    if(G.files>=3)e='truth';
    else if(linked>=4)e='underground';
    else if(G.dexBetrayed)e='betrayed';
    else if(others.length===0)e='alone';
    else if(!G.deaths.length&&!G.lost&&!G.left&&G.rescued>=4)e='everyone';
    else if(G.deaths.length||G.lost||G.left)e='hard';
    else e='rescued';
  }
  saveEnding(e);
  const names=others.map(p=>p.name);const nm=names.length?names.join(', '):'no one';
  const gone=[...G.deaths];
  const T={
    everyone:`On day 20 the rotor blades cut through the silence. Every single person you found walked out beside you: ${nm}. Nobody left behind. Nobody lost. You did the impossible.`,
    rescued:`Rescue arrived on day 20. You climbed into the helicopter with ${nm}. Below you, something tall and dark stood perfectly still in the street, listening to you leave.`,
    hard:`Rescue arrived on day 20. You made it out with ${nm}. But not everyone did.${gone.length?' You think about '+gone.join(', ')+'.':''}${G.left?' And you think about the ones you walked away from.':''} You did what you had to. Didn't you?`,
    alone:`The helicopter came on day 20. You climbed aboard with no one beside you. The pilot asks if there's anyone else. You don't answer. You survived. Was it worth it?`,
    underground:`By day 20 nobody had to step outside at all. Your tunnels linked the whole street: a hidden city right under the creature's feet. When rescue finally came, ${nm==='no one'?'you':'you and '+nm} almost didn't want to leave.`,
    sewers:`You led ${nm==='no one'?'yourself':'everyone ('+nm+')'} down into the storm sewers. Hours of black water and echoes. Then a ladder, a grate, and fresh air. You climbed out past the edge of the city into birdsong. It never followed.`,
    truth:`Three files. One answer. The creature was Project Listener, built to hunt anything that makes a sound. It escaped. ${has('leo')?'On day 20, Leo takes your hand. "It\'s not angry," he whispers. "It\'s lonely." He walks out into the street before you can stop him, and the creature lowers itself to the ground in front of him and goes completely still.':'Somewhere out there is a boy it never hurt. Maybe next time you\'ll find him.'} Rescue arrives. The truth goes with you.`,
    betrayed:`Rescue arrived on day 20. When you reached the helicopter, Dex was already on board, eating your food. He didn't look at you. ${others.length?'You climb in with '+nm+' and sit as far from him as you can.':'You climb in alone.'}`,
    taken:`It found you. Nobody knows exactly what happened next. The quiet outside got a little quieter.`,
    starved:`You made it through ${G.day-1} nights. In the end it wasn't the creature that got you. It was the empty cupboards.`,
    buried:`The tunnel groaned, then gave way. The earth closed over you, as silent as the thing up above.`
  }[e];
  const E=ENDINGS[e],got=gotEndings();
  if(['taken','buried'].includes(e))scream();else tone(e==='starved'?110:330,1.5,'sine',.05,e==='starved'?.5:1.5);
  show(`<div class="wrap"><div class="ending"><div class="ic">${E.ic}</div><p class="dim small" style="letter-spacing:.2em">ENDING</p><h1 style="margin:0 0 20px;font-size:clamp(30px,6vw,54px)">${E.t}</h1><p>${T}</p>
  <p class="dim small" style="margin-top:24px">Survived ${Math.min(G.day,G.max)} day${G.day>1?'s':''} · Rescued ${G.rescued} · Lost ${G.deaths.length+G.lost} · Left behind ${G.left} · Files ${G.files}/3</p>
  <h3>Endings found ${got.length}/${Object.keys(ENDINGS).length}</h3>
  <div class="elist">${Object.keys(ENDINGS).map(k=>got.includes(k)?`<span class="got">${ENDINGS[k].ic} ${ENDINGS[k].t}</span>`:'<span>???</span>').join('')}</div>
  <button class="btn big" onclick="startPick()">PLAY AGAIN</button><br><button class="btn" style="margin-top:10px" onclick="titleScreen()">Title screen</button></div></div>`);
}

titleScreen();
</script>
